<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="奶龙农业大学域名跳转页，5秒后前往华南农业大学官方网站。">
  <meta name="theme-color" content="#f6f2db">
  <title>正在跳转华南农业大学官网……</title>
  <link rel="icon" type="image/png" href="assets/nailong-avatar.png">
  <link rel="preload" as="image" href="assets/nailong-avatar.png">
  <link rel="preload" as="image" href="assets/nailong-farm.png">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
  <noscript><meta http-equiv="refresh" content="5;url=https://scau.edu.cn/"></noscript>
</head>
<body>
  <div class="farm-background" aria-hidden="true"></div>
  <main class="redirect-card" aria-labelledby="redirect-title">
    <p class="site-name"><span class="sun-dot" aria-hidden="true"></span>奶龙农业大学</p>
    <div class="avatar-frame">
      <div class="avatar" role="img" aria-label="旋转的奶龙圆形头像"></div>
    </div>
    <h1 id="redirect-title">正在跳转<span class="title-destination">华南农业大学官网……</span></h1>
    <p class="subtitle">跟着奶龙，一起去华农看看</p>
    <div class="countdown" aria-label="跳转倒计时"><span id="seconds" aria-live="polite">5</span><span class="seconds-label">秒</span></div>
    <p class="countdown-note" id="countdown-note">倒计时结束后自动进入官网</p>
    <div class="progress-track" aria-hidden="true"><span id="progress"></span></div>
    <a class="enter-button" href="https://scau.edu.cn/">立即进入官网 <span aria-hidden="true">↗</span></a>
    <p class="destination">目的地 <a href="https://scau.edu.cn/">scau.edu.cn</a></p>
    <noscript><p class="noscript-note">5秒后自动跳转，也可点击上方按钮进入。</p></noscript>
  </main>
</body>
</html>
